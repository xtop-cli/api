[workspace]
resolver = "2"
members = [
    "crates/plugin-api",
    "crates/effect-api",
    "crates/extension-api",
    "crates/widget-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.87"

[workspace.dependencies]
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
